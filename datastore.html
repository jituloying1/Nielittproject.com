<!DOCTYPE html>
<html>
<head>

<title>ABC School Data Store</title>

<style>

body{font-family:Arial;background:#f2f2f2;padding:40px;}
.container{width:95%;margin:auto;background:white;padding:20px;border-radius:8px;}

table{width:100%;border-collapse:collapse;margin-top:20px;}

th,td{border:1px solid black;padding:8px;text-align:center;}

img{width:60px;height:60px;}

button{padding:6px 10px;background:red;color:white;border:none}

</style>

<script>

function loadData(){

let users=JSON.parse(localStorage.getItem("users"))||[];

let table=document.getElementById("data");

users.forEach((u,i)=>{

let row=table.insertRow();

row.insertCell(0).innerHTML=u.appID;
row.insertCell(1).innerHTML=u.name;
row.insertCell(2).innerHTML=u.father;
row.insertCell(3).innerHTML=u.mother;
row.insertCell(4).innerHTML=u.dob;
row.insertCell(5).innerHTML=u.post;

row.insertCell(6).innerHTML=u.photo?`<img src="${u.photo}">`:"";
row.insertCell(7).innerHTML=u.signature?`<img src="${u.signature}">`:"";

row.insertCell(8).innerHTML=`<button onclick="deleteUser(${i})">Delete</button>`;

});

}

function deleteUser(i){

let users=JSON.parse(localStorage.getItem("users"))||[];

users.splice(i,1);

localStorage.setItem("users",JSON.stringify(users));

location.reload();

}

window.onload=loadData;

</script>

</head>

<body>

<div class="container">

<h2>ABC School Application Data</h2>

<table id="data">

<tr>

<th>ID</th>
<th>Name</th>
<th>Father</th>
<th>Mother</th>
<th>DOB</th>
<th>Post</th>
<th>Photo</th>
<th>Sign</th>
<th>Action</th>

</tr>

</table>

<br>

<a href="index.html">
<button style="background:green">Back To Form</button>
</a>

</div>

</body>
</html>
