<!DOCTYPE html>
<html>
<head>
<title>ABC School - Attendance</title>
<style>
body { font-family: Arial; background: #f2f2f2; padding: 40px; }
h2 { text-align: center; color: #007BFF; }
table { border-collapse: collapse; width: 100%; background: white; margin-bottom: 20px; }
th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
th { background: #007BFF; color: white; }
button { padding: 6px 10px; margin: 5px; cursor: pointer; border: none; border-radius: 4px; }
button.download { background: #17a2b8; color: white; }
</style>
</head>
<body onload="loadAttendance()">

<h2>ABC School - Student Attendance</h2>

<table>
<tr>
    <th>Student ID</th>
    <th>Name</th>
    <th>Class</th>
    <th>Date</th>
    <th>Present Days</th>
    <th>Absent Days</th>
    <th>Holidays</th>
    <th>Total Days</th>
</tr>
<tbody id="attendanceData"></tbody>
</table>

<button class="download" onclick="downloadCSV()">Download CSV</button>
<br><br>
<a href="attendance_control.html"><button>Attendance Control</button></a>

<script>
let attendanceRecords = [];

function loadAttendance(){
    attendanceRecords = JSON.parse(localStorage.getItem("attendanceRecords")) || [];
    displayAttendance(attendanceRecords);
}

function displayAttendance(records){
    let tbody = "";
    records.forEach(r=>{
        let total = r.present + r.absent + r.holidays;
        tbody += `<tr>
            <td>${r.rollNo}</td>
            <td>${r.name}</td>
            <td>${r.className}</td>
            <td>${r.date}</td>
            <td>${r.present}</td>
            <td>${r.absent}</td>
            <td>${r.holidays}</td>
            <td>${total}</td>
        </tr>`;
    });
    document.getElementById("attendanceData").innerHTML = tbody;
}

function downloadCSV(){
    let csv = "Roll No,Name,Class,Date,Present Days,Absent Days,Holidays,Total Days\n";
    attendanceRecords.forEach(r=>{
        let total = r.present + r.absent + r.holidays;
        csv += `"${r.rollNo}","${r.name}","${r.className}","${r.date}","${r.present}","${r.absent}","${r.holidays}","${total}"\n`;
    });
    let blob = new Blob([csv], {type:"text/csv"});
    let a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "Student_Attendance.csv";
    a.click();
}
</script>

</body>
</html>
